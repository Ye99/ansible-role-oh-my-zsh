# code: language=ansible
---
- name: Install dependencies
  become: "{{ ansible_facts.distribution != 'MacOSX' }}"
  ansible.builtin.package:
    name: '{{ oh_my_zsh_dependencies }}'
    state: present

- name: Clone oh-my-zsh for users
  tags:
    # Suppress warning: [ANSIBLE0006] git used in place of git module
    # Git module doesn't allow us to set `core.autocrlf=input`.
    - skip_ansible_lint
  become: true
  become_user: '{{ user.username }}'
  # core.autocrlf=input prevents https://github.com/ohmyzsh/ohmyzsh/issues/4402
  ansible.builtin.command: 'git clone -c core.autocrlf=input --depth=1 https://github.com/ohmyzsh/ohmyzsh.git .oh-my-zsh'
  args:
    chdir: '~{{ user.username }}'
    creates: '~{{ user.username }}/.oh-my-zsh'
  with_items: "{{ users }}"
  when: "((user.oh_my_zsh | default({})).install | default(oh_my_zsh_install)) | bool"
  loop_control:
    loop_var: user
    label: '{{ user.username }}'

- name: Set permissions of oh-my-zsh for users
  become: true
  ansible.builtin.file:
    path: '~{{ user.username }}/.oh-my-zsh'
    # Prevent the cloned repository from having insecure permissions. Failing to do
    # so causes compinit() calls to fail with "command not found: compdef" errors
    # for users with insecure umasks (e.g., "002", allowing group writability).
    mode: 'go-w'
    recurse: true
  with_items: "{{ users }}"
  when: "((user.oh_my_zsh | default({})).install | default(oh_my_zsh_install)) | bool"
  loop_control:
    loop_var: user
    label: '{{ user.username }}'

- name: Set default shell for users
  become: true
  ansible.builtin.user:
    name: '{{ user.username }}'
    shell: '{{ oh_my_zsh_zsh_path }}'
  with_items: "{{ users }}"
  when: "((user.oh_my_zsh | default({})).install | default(oh_my_zsh_install)) | bool"
  loop_control:
    loop_var: user
    label: '{{ user.username }}'

- name: Probe bash PATH for users
  become: true
  become_user: '{{ user.username }}'
  ansible.builtin.command:
    argv:
      - bash
      - -c
      # `bare=` is the PATH of a bash that reads no startup files; `login=` is
      # the PATH of a login + interactive bash, the only mode that reads
      # ~/.bashrc (Debian's ships a `case $- in *i*` guard that returns early
      # otherwise). The difference between the two is exactly the set of PATH
      # entries this user's bash dotfiles contribute.
      # Read via `env` rather than by echoing $PATH: the value must not pass
      # through an outer shell that would expand it before the inner one runs.
      - |
        bash --noprofile --norc -c env | grep '^PATH=' | sed 's/^PATH=/bare=/'
        bash -lic env 2>/dev/null | grep '^PATH=' | sed 's/^PATH=/login=/'
  register: oh_my_zsh_bash_path
  changed_when: false
  failed_when: false
  check_mode: false
  with_items: '{{ users }}'
  when: >-
    (oh_my_zsh_migrate_bash_path | bool)
    and (((user.oh_my_zsh | default({})).install | default(oh_my_zsh_install)) | bool)
    and (((user.oh_my_zsh | default({})).write_zshrc
          | default(oh_my_zsh_write_zshrc)) | bool)
  loop_control:
    loop_var: user
    label: '{{ user.username }}'

- name: Write .zshrc for users
  become: true
  become_user: '{{ user.username }}'
  ansible.builtin.template:
    src: zshrc.j2
    dest: '~{{ user.username }}/.zshrc'
    backup: true
    mode: 'u=rw,go=r'
  with_items: '{{ users }}'
  vars:
    user_oh_my_zsh: '{{ user.oh_my_zsh | default({}) }}'
    bash_path_probe: >-
      {{ (oh_my_zsh_bash_path.results | default([]))
         | selectattr('stdout_lines', 'defined')
         | selectattr('user.username', 'equalto', user.username)
         | map(attribute='stdout_lines') | first | default([], true) }}
    bash_path_bare: >-
      {{ (bash_path_probe | select('match', '^bare=') | first
          | default('')) | replace('bare=', '') | split(':') }}
    bash_path_login: >-
      {{ (bash_path_probe | select('match', '^login=') | first
          | default('')) | replace('login=', '') | split(':') }}
    bash_path_extras: >-
      {{ bash_path_login
         | reject('in', bash_path_bare)
         | reject('equalto', '')
         | unique | list }}
  when: >-
    ((user_oh_my_zsh.install | default(oh_my_zsh_install)) | bool)
    and ((user_oh_my_zsh.write_zshrc | default(oh_my_zsh_write_zshrc)) | bool)
  loop_control:
    loop_var: user
    label: '{{ user.username }}'
