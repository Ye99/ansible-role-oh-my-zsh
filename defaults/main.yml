# code: language=ansible
---
# Default theme
oh_my_zsh_theme: gallifrey

# Default plugins
oh_my_zsh_plugins:
  - git
  - ansible
  - common-aliases
  - colored-man-pages
  - colorize
  - pip
  - command-not-found
  - alias-finder

# Whether to install by default for all specified users.
# May be overridden by `oh_my_zsh_install` under each user.
oh_my_zsh_install: true

# Default update mode for Oh-My-Zsh
# accepted values are:
# disabled (default)
# auto
# reminder
oh_my_zsh_update_mode: auto

# Default update frequency in days. When the update mode is set to a value other
# than "disabled", this is the frequency (in days) to check for a new version.
# The value 0 will check every time a new shell session starts.
oh_my_zsh_update_frequency: 8

# Whether to write the ~/.zshrc file
# May be overridden by `oh_my_zsh: write_zshrc:` under each user.
oh_my_zsh_write_zshrc: true

# Default user to install oh-my-zsh for when running playbook.yaml.
# Override on the command line with: -e "zsh_username=someuser"
zsh_username: ye

# Migrate PATH entries from the user's bash environment into ~/.zshrc.
# zsh reads none of ~/.profile, ~/.bash_profile or ~/.bashrc, so any PATH entry
# those files add (tool installers commonly append one) disappears when the
# login shell is switched to zsh, and the tool stops resolving. When enabled,
# the role probes the user's bash PATH on the target host and re-adds whatever
# bash has that a bare shell does not.
oh_my_zsh_migrate_bash_path: true
